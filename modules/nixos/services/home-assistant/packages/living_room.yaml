# Irulan on the living room TV, from whatever state the TV and receiver are
# in, and the TV put away again. `av on` and `av off` (modules/nixos/av.nix)
# start these, by hand or from av-input when Irulan's keyboard, trackpad or
# controllers are picked up or put down, and return straight away: with the
# TV off, coming on takes about twenty seconds.
#
# Irulan and the Apple TV both plug into the Denon, which has no network, and
# Irulan can't speak CEC (its GPU's ports carry none, and neither DisplayPort
# adapter tried would tunnel it). So:
#
#   1. Only if the Frame is off or showing art: Wake-on-LAN, then turn_on.
#      Fully off, it closes its control API, so turn_on alone has nothing to
#      talk to, but its network chip still answers a magic packet. A TV that's
#      already on is left alone, since this can run on any keypress.
#   2. The Denon's CBL/SAT button, which is Irulan's input, through the
#      Broadlink. Waking the TV wakes the Denon and the Apple TV over CEC, and
#      the Apple TV claims the Denon's input a few seconds later, so after a
#      wake the button goes twice, the second after that grab. The button also
#      wakes the Denon if it slept through.
#
# The button's code is declared rather than learned, since this Broadlink
# stopped hearing remotes once its case had been opened (it still sends). It's
# the Denon RC-1253's CBL/SAT from Flipper-IRDB
# (Audio_and_Video_Receivers/Denon/Denon_RC1253.ir): Kaseikyo, vendor 0x3254,
# command 0x2D3, the frame 54 32 40 31 2D 5C sent least significant bit first
# in 432µs units, as a Broadlink IR packet (0x26, ticks of 269/8192µs, 0x0D05).
# Another of the remote's buttons comes out the same way from its entry there.
#
# Off is art mode, the way the Frame is normally left. Set from here it acts
# like the remote's power button: the Frame tells the HDMI devices to stand by
# over CEC, and the Denon and the Apple TV both go. CEC is the only way to put
# the Denon in standby. Its remote's one power button toggles, so sent blind it
# would as often turn the Denon on, and the older Denon protocol's discrete
# power codes (2-225 and 2-226, Flipper-IRDB's Denon_AVR_Receiver.ir) do
# nothing on this model. (Both tried 2026-11-07.)

script:
  irulan_on_tv:
    alias: Living Room / Show Irulan
    # A request while one runs adds nothing, since it ends in the same place.
    mode: single
    max_exceeded: silent
    sequence:
      - if:
          - condition: or
            conditions:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: media_player.living_room_living_room_smart
                    state: "on"
              - condition: state
                entity_id: media_player.living_room_living_room_smart
                attribute: art_mode_status
                state: "on"
        then:
          - action: wake_on_lan.send_magic_packet
            data:
              mac: "10:2b:41:6f:9c:c4"
          # It answers within a few seconds of the packet and Home Assistant
          # notices on its next poll. Past this it was on already, or isn't
          # coming.
          - wait_template: "{{ is_state('media_player.living_room_living_room_smart', 'on') }}"
            timeout: 20
            continue_on_timeout: true
          - action: media_player.turn_on
            target:
              entity_id: media_player.living_room_living_room_smart
          - delay: 6
          # A Broadlink that missed this one still sends the last.
          - action: remote.send_command
            continue_on_error: true
            target:
              entity_id: remote.living_room_blaster
            data:
              command: &cbl_sat "b64:JgBjAHE5Dg4ODg4rDg4OKw4ODisODg4ODisODg4ODisOKw4ODg4ODg4ODg4ODg4ODg4OKw4ODisODg4ODg4OKw4rDg4ODg4rDg4OKw4rDg4OKw4ODg4ODg4ODisOKw4rDg4OKw4ODg0F"
          - delay: 8
      - action: remote.send_command
        target:
          entity_id: remote.living_room_blaster
        data:
          command: *cbl_sat

  irulan_off_tv:
    alias: Living Room / Put Irulan Away
    mode: single
    max_exceeded: silent
    fields:
      automatic:
        name: Automatic
        description: >-
          Nobody asked for this, so it gives way to the Apple TV: while that's
          playing, the TV stays on.
        selector:
          boolean:
    sequence:
      # An on still under way would press CBL/SAT after this, and the button
      # wakes the Denon.
      - action: script.turn_off
        target:
          entity_id: script.irulan_on_tv
      - condition: template
        value_template: >-
          {{ not (automatic | default(false))
             or not is_state('media_player.living_room_tv', 'playing') }}
      # Asked of a Frame that's fully off, art mode would turn it on.
      - condition: state
        entity_id: media_player.living_room_living_room_smart
        state: "on"
      - condition: state
        entity_id: media_player.living_room_living_room_smart
        attribute: art_mode_status
        state: "off"
      - action: samsungtv_smart.set_art_mode
        target:
          entity_id: media_player.living_room_living_room_smart
