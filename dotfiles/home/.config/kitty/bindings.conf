# Scrolling {{{

# <-- Native Kitty scrolling

map ctrl+alt+k       scroll_line_up
map ctrl+alt+j       scroll_line_down

map ctrl+alt+u       scroll_page_up
map ctrl+alt+d       scroll_page_down

map ctrl+alt+g       scroll_home
map ctrl+alt+shift+g scroll_end

# --> Native Kitty scrolling

# <-- Smart Kitty scrolling
map ctrl+shift+k    kitten kittens/smart-scroll/smart_scroll.py scroll_line_up   ctrl+shift+k
map ctrl+shift+j    kitten kittens/smart-scroll/smart_scroll.py scroll_line_down ctrl+shift+j

map ctrl+shift+u          kitten kittens/smart-scroll/smart_scroll.py scroll_page_up   ctrl+u
map ctrl+shift+d          kitten kittens/smart-scroll/smart_scroll.py scroll_page_down ctrl+d
# --> Smart Kitty scrolling

map ctrl+s>{     show_scrollback # Native scrollback
map ctrl+s>} kitten kittens/grab/grab.py # Grab scrollback

# kitty-scrollback.nvim Kitten alias. Not a relative path, because kitty
# resolves those against its own config dir — but ~ is expanded, so it doesn't
# have to name a home. Points at where vim.pack installs the plugin
# (packages/kitty.lua), not the old vim-plug plugged-kitty dir.
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/site/pack/core/opt/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Browse scrollback buffer in nvim
map ctrl+s>] kitty_scrollback_nvim --nvim-args -u ~/.config/nvim/init-kitty.vim
# Browse output of the last shell command in nvim
map ctrl+s>[ kitty_scrollback_nvim --config ksb_builtin_last_cmd_output --nvim-args -u ~/.config/nvim/init-kitty.vim

# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Clear screen
# map super+l combine : clear_terminal scroll active : send_text normal,application \x0c
map ctrl+l combine : clear_terminal scroll active : send_text normal,application \x0c
map ctrl+s>shift+s clear_terminal scrollback active

# }}}

# Window Management {{{

 # map ctrl+s>-       combine : launch --cwd=current : goto_layout vertical
 # map ctrl+s>\       combine : launch --cwd=current : goto_layout horizontal

 map ctrl+s>shift+c new_os_window
 map ctrl+s>x       close_window

 map ctrl+s>alt+k     next_window
 map ctrl+s>alt+j     previous_window
 # map ctrl+s>l     next_window
 # map ctrl+s>h     previous_window

 map ctrl+s>-     launch --location=hsplit --cwd=current
 map ctrl+s>\     launch --location=vsplit --cwd=current

 map ctrl+s>space layout_action rotate

 map ctrl+s>shift+h move_window left
 map ctrl+s>shift+l move_window right
 map ctrl+s>shift+k move_window up
 map ctrl+s>shift+j move_window down

 map ctrl+s>h neighboring_window left
 map ctrl+s>l neighboring_window right
 map ctrl+s>k neighboring_window up
 map ctrl+s>j neighboring_window down

 # map ctrl+s>}     move_window_forward
 # map ctrl+s>{     move_window_backward
 map ctrl+shift+` move_window_to_top

 map ctrl+shift+1        first_window
 map ctrl+shift+2        second_window
 map ctrl+shift+3        third_window
 map ctrl+shift+4        fourth_window
 map ctrl+shift+5        fifth_window
 map ctrl+shift+6        sixth_window
 map ctrl+shift+7        seventh_window
 map ctrl+shift+8        eighth_window
 map ctrl+shift+9        ninth_window
 map ctrl+shift+0        tenth_window

 # you can open a new window running an arbitrary program, for example:
 # map ctrl+shift+y      new_window mutt

 # you can pass the current selection to the new program by using the
 # @selection placeholder
 map ctrl+shift+y      new_window less @selection

 # you can even send the contents of the current screen + history buffer as
 # stdin using the placeholders @text (which is the plain text) and @ansi
 # (which includes text styling escape codes).  for only the current screen,
 # use @screen or @ansi_screen.  for example, the following command opens the
 # scrollback buffer in less in a new window.
 map ctrl+shift+y      new_window @ansi less +g -r

 # you can open a new window with the current working directory set to the
 # working directory of the current window using
 map ctrl+alt+enter    new_window_with_cwd

# }}}

# Session Management {{{

# TODO: kill the 3-step chords when I get used to `shift+{1,2,3...}`

map ctrl+s>s>d     goto_session ~/.config/kitty/sessions/dotfiles.kitty-session
map ctrl+s>shift+1 goto_session ~/.config/kitty/sessions/dotfiles.kitty-session
map ctrl+s>s>w     goto_session ~/.config/kitty/sessions/work.kitty-session
map ctrl+s>shift+2 goto_session ~/.config/kitty/sessions/work.kitty-session
map ctrl+s>s>p     goto_session ~/.config/kitty/sessions/personal.kitty-session
map ctrl+s>shift+3 goto_session ~/.config/kitty/sessions/personal.kitty-session

# Open interactive session switcher
map ctrl+s>g       goto_session
# Jump to previous session (doesn't cycle through session
# history and instead works more like channel "jump" on an
# old TV remote flipping back and forth between two sessions)
map ctrl+s>shift+g goto_session -1

# }}}

# Tab Management {{{

map ctrl+s>n       next_tab
map ctrl+s>p       previous_tab
map ctrl+s>t       new_tab_with_cwd
map ctrl+s>shift+t launch --type=tab --add-to-session . --cwd=~
map ctrl+s>c       kitten kittens/zoxide_tab.py
# The outer shell is interactive (it needs .zshrc for `__zoxide_zi`) but
# deliberately not a login shell. A login shell runs .zlogin before the -c
# command, so the welcome banner would print once here and again in the shell
# this execs.
map ctrl+s>shift+c launch --type=tab --add-to-session . --cwd=~ /run/current-system/sw/bin/zsh -i -c '__zoxide_zi; exec zsh --login -i'
map ctrl+s>&       close_tab
map ctrl+s>shift+. move_tab_forward
map ctrl+s>shift+, move_tab_backward
map ctrl+s>,       set_tab_title

# map ctrl+s>space   next_layout

# you can also create shortcuts to go to specific tabs, with 1 being the
# first tab
map ctrl+s>1          goto_tab 1
map ctrl+s>2          goto_tab 2
map ctrl+s>3          goto_tab 3
map ctrl+s>4          goto_tab 4
map ctrl+s>5          goto_tab 5
map ctrl+s>6          goto_tab 6
map ctrl+s>7          goto_tab 7
map ctrl+s>8          goto_tab 8
map ctrl+s>9          goto_tab 9

# }}}

# Layout Management {{{
# you can create shortcuts to switch to specific layouts

map ctrl+s>shift+\ goto_layout vertical
map ctrl+s>shift+- goto_layout horizontal

map ctrl+s>r start_resizing_window

map ctrl+s>z       kitten zoom_toggle.py
map ctrl+s>=       kitten balance_splits.py

# }}}

# Font Sizes {{{

map ctrl+s>shift+=   change_font_size all +1.0
map ctrl+s>_         change_font_size all -1.0
map ctrl+s>backspace change_font_size all 0

# }}}


# Miscellaneous {{{

map ctrl+s>shift+r load_config_file

map ctrl+s>shift+u input_unicode_character

# Files
map alt+h>f              kitten hints --program -    --type=path
map alt+h>o>f            kitten hints --program open --type=path
map alt+h>y>f            kitten hints --program @    --type=path

# URLs
map alt+h>u              kitten hints --program -    --type=url
map alt+h>o>u            kitten hints --program open --type=url
map alt+h>y>u            kitten hints --program @    --type=url

# Hashes (Git SHAs, etc.)
map alt+h>h              kitten hints --program -    --type=hash
map alt+h>o>h            kitten hints --program open --type=hash
map alt+h>y>h            kitten hints --program @    --type=hash

# Repositories
map alt+h>g              kitten hints --program -    --type=regex --regex "git@[a-zA-Z0-9._-]+:[a-zA-Z0-9._-]+/[a-zA-Z0-9._/-]+"
map alt+h>o>g            kitten hints --program open --type=regex --regex "git@[a-zA-Z0-9._-]+:[a-zA-Z0-9._-]+/[a-zA-Z0-9._/-]+"
map alt+h>y>g            kitten hints --program @    --type=regex --regex "git@[a-zA-Z0-9._-]+:[a-zA-Z0-9._-]+/[a-zA-Z0-9._/-]+"

# Agent session resumes (Claude Code)
map alt+h>r              kitten hints --program -    --type=regex --regex "claude (?:--resume|-r) [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
map alt+h>o>r            kitten hints --program "launch --type=tab --hold zsh -lc" --type=regex --regex "claude (?:--resume|-r) [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
map alt+h>y>r            kitten hints --program @    --type=regex --regex "claude (?:--resume|-r) [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"

# Numbers
map alt+h>n              kitten hints --program -    --type=regex --regex "[0-9]+"
map alt+h>o>n            kitten hints --program open --type=regex --regex "[0-9]+"
map alt+h>y>n            kitten hints --program @    --type=regex --regex "[0-9]+"

# sending arbitrary text on shortcut key presses
# you can tell kitty to send arbitrary (utf-8) encoded text to
# the client program when pressing specified shortcut keys.
map ctrl+alt+a send_text all special text

# Toggle opacity between opaque and default

map ctrl+s>shift+o set_background_opacity 1.0
map ctrl+s>o       set_background_opacity default

# }}}
# key names: http://www.glfw.org/docs/latest/group__keys.html
